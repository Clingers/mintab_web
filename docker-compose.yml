version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mintab_backend
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost,http://192.3.161.201
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app  # 开发时挂载，生产可移除
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mintab_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    driver: bridge
